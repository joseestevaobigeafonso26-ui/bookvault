<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Sem ligação | BookVault</title>
  <style>
    :root { --bg:#f8fafc; --fg:#1e293b; --muted:#64748b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#f1f5f9; --muted:#94a3b8; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; }
    img { width:88px; height:88px; border-radius:22px; margin-bottom:20px; }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:0 0 24px; color:var(--muted); max-width:320px; line-height:1.5; }
    button { background:#16a34a; color:#fff; border:0; border-radius:12px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="BookVault">
    <h1>Sem ligação à internet</h1>
    <p>Não conseguimos carregar o BookVault agora. Verifica a tua ligação e tenta de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
